<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PONG — Neon Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>

<header class="nav">
  <a class="logo" href="index.html">PONG<span>.</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a class="active" href="game.html">Play</a>
    <a href="how-to-play.html">How to Play</a>
  </nav>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>

<main class="game-page">
  <div class="game-top">
    <div><div class="eyebrow">ARCADE / MATCH 01</div><h1>NEON ARENA</h1><div class="bot-badge">BOT DIFFICULTY: <b id="botBadge">MEDIUM</b></div></div>
    <div class="status"><span id="statusDot"></span><span id="statusText">READY</span></div>
  </div>

  <section class="hud-row">
    <div class="hud-card"><span>PLAYER</span><strong id="leftScore">0</strong></div>
    <div class="match-center">
      <div class="round-label">FIRST TO 7</div>
      <div class="round-track"><span id="roundFill"></span></div>
      <div class="rally">RALLY <b id="rallyCount">0</b></div>
    </div>
    <div class="hud-card cpu"><span>CPU</span><strong id="rightScore">0</strong></div>
  </section>

  <section class="game-shell" id="gameShell">
    <div class="arena-tag">PONG // ONLINE</div>
    <div class="countdown" id="countdown"></div>
    <canvas id="game" width="1000" height="600"></canvas>
    <div class="center-message" id="centerMessage">CLICK START TO ENTER</div>
  </section>

  <div class="game-controls">
    <div class="difficulty-control" id="difficultyControl">
      <span>BOT</span>
      <button class="difficulty-trigger" id="difficultyTrigger" type="button" aria-expanded="false">
        <span id="difficultyValue">Medium</span><span class="difficulty-chevron">⌄</span>
      </button>
      <div class="difficulty-menu" id="difficultyMenu">
        <button type="button" data-difficulty="easy">Easy</button>
        <button type="button" data-difficulty="medium" class="selected">Medium</button>
        <button type="button" data-difficulty="hard">Hard</button>
        <button type="button" data-difficulty="god">God</button>
      </div>
    </div>
    <button class="btn primary" id="startBtn">Start Match</button>
    <button class="btn ghost" id="pauseBtn">Pause</button>
    <button class="btn ghost" id="resetBtn">Reset</button>
    <button class="btn ghost" id="soundBtn">Sound: On</button>
  </div>
  <p class="hint">Mouse / ↑ ↓ / W S &nbsp;•&nbsp; Space = Pause &nbsp;•&nbsp; First to 7 wins</p>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="eyebrow">MATCH COMPLETE</div>
      <h2 id="resultTitle">YOU WIN</h2>
      <p id="resultScore">7 — 4</p>
      <button class="btn primary" id="playAgainBtn">Play Again →</button>
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
